<!doctype html><meta charset="utf-8"><title>Norito · conferência de rituais e escala</title><style>body{margin:24px;background:#171b15;color:#eef1e7;font:15px Arial}h1{font-size:24px}button{padding:10px 16px;background:#d1f49b;border:0;border-radius:5px;cursor:pointer}.ritual-preview{display:block;width:min(760px,100%);height:auto;border:1px solid #526047;margin:20px 0}.probe{position:absolute;left:-10000px;top:0;width:1920px;height:1431px}.pass{color:#c8f2a1}.fail{color:#ffaba0}iframe{width:100%;height:760px;border:1px solid #526047}</style><h1>Norito Goshi · rituais uniformes</h1><p>Mesma fonte, alinhamento e espaçamento; cada descrição recebe a altura necessária.</p><div id="preview"></div><button id="run">Testar redimensionamento</button><ol id="results"></ol><h2>Interface PhotoCraft</h2><iframe id="app" src="../dist/" title="Editor em teste"></iframe><script type="module">
import {blank,block,clone,makeCharacter} from '../dist/model.mjs';
import {sheetSVG} from '../dist/sheet.mjs';
import {resizeVisualBlock} from '../dist/visual-sizing.js';
const source=await(await fetch('../dist/presets.json')).json(),n=source.characters.find(c=>c.nome==='Norito Goshi'),doc=makeCharacter(n,source.details,source.spells,source.summaries);
doc.showFrame=false;doc.accent='#4f9acb';doc.rituals=[{id:'qa-cineraria',title:'CINERÁRIA',body:'Você cria uma névoa de cinzas em um raio de 3 metros. Durante 3 rodadas, uma vez por rodada, pode receber +d4 em um teste de conjuração ou acrescentar +1d4 ao dano de um ritual. Não afeta Eco Espiral.'},{id:'qa-eco',title:'ECO ESPIRAL',body:'Você marca uma criatura próxima e acumula o dano que ela sofre até sua próxima rodada. Ao gastar uma ação menor, causa metade do dano acumulado, limitado a 10 PV. O alvo pode fazer um teste de Físico + Vigor (DT 10) para reduzir esse dano pela metade novamente.'},{id:'qa-consumir',title:'CONSUMIR MANANCIAL',body:'Você absorve a energia vital ao seu redor e recebe 1d6+2 PV temporários até o fim da cena. Esses PV são perdidos antes dos PV normais e não se acumulam com outras conjurações deste ritual.'}];
const list=block('rituals','Rituais',25,25,710,540,{font:22,textStyle:{bold:true,size:22}});doc.blocks=[list];document.querySelector('#preview').innerHTML=`<svg class="ritual-preview" viewBox="0 0 760 620">${sheetSVG(doc,source.skills)}</svg>`;
const assert=(ok,msg)=>{if(!ok)throw Error(msg);},wait=async(fn,msg)=>{const end=Date.now()+12000;while(Date.now()<end){if(fn())return;await new Promise(r=>setTimeout(r,40));}throw Error(msg);};
document.querySelector('#run').onclick=async()=>{const results=document.querySelector('#results');results.innerHTML='';const check=async(name,fn)=>{const li=document.createElement('li');try{await fn();li.textContent='✓ '+name;li.className='pass';}catch(e){li.textContent='✗ '+name+': '+e.message;li.className='fail';throw e;}finally{results.append(li);}};
try{
await check('Os três rituais mantêm a mesma fonte, sem sobreposição',async()=>{await document.fonts.ready;const items=[...document.querySelectorAll('#preview .ritual-entry')],sizes=items.flatMap(g=>[...g.querySelectorAll('.ritual-body')].map(t=>t.getAttribute('font-size')));assert(new Set(sizes).size===1,'Fontes diferentes');for(let i=1;i<items.length;i++)assert(items[i].getBoundingClientRect().top>items[i-1].getBoundingClientRect().bottom,'Entradas sobrepostas');});
await check('Todos os 22 tipos reduzem seus desenhos e texto a 50%',async()=>{for(const type of ['portrait','name','identity','attributes','skills','resource','profile','ability','equipment','rituals','text','separator','image','counter','heading','attributeRow','skillRow','resourceValue','resourceTrack','shape','ritualPart','componentPart']){const d=clone(doc);d.portrait='./assets/norito.webp';d.abilities=[{id:'a',title:'Habilidade',body:'Texto de teste'}];d.blocks=[block(type,type,0,0,500,200,{ref:type==='ritualPart'?d.rituals[0].id:'a',body:'Descrição de exemplo.',headingText:'TÍTULO',resource:'pv',max:3,counterKind:'impetus',attr:'Fisico',skillKey:'Luta',skillLabel:'LUTA',skillAttr:'Fisico',binding:'attrValue',image:'./assets/norito.webp',shape:'circle'})];const holder=document.createElement('div');holder.innerHTML=`<svg class="probe" viewBox="0 0 1920 1431">${sheetSVG(d,source.skills)}</svg>`;document.body.append(holder);const before=holder.querySelector('.visual-content').getBoundingClientRect();resizeVisualBlock(d.blocks[0],250,100);holder.insertAdjacentHTML('beforeend',`<svg class="probe" viewBox="0 0 1920 1431">${sheetSVG(d,source.skills)}</svg>`);const all=holder.querySelectorAll('.visual-content'),after=all[1].getBoundingClientRect();assert(all[1].getAttribute('transform')==='scale(0.5,0.5)',type+' sem escala');if(before.width>0)assert(Math.abs(after.width/before.width-.5)<.02,type+' largura incorreta');if(before.height>0)assert(Math.abs(after.height/before.height-.5)<.02,type+' altura incorreta');holder.remove();}});
const frame=document.querySelector('#app');await wait(()=>frame.contentDocument?.querySelector('#sheet .sheet-block'),'Editor indisponível');let d=frame.contentDocument,w=frame.contentWindow;const $=s=>d.querySelector(s),click=s=>{assert($(s),'Controle ausente '+s);$(s).click();},input=(s,value,event='input')=>{$(s).value=value;$(s).dispatchEvent(new w.Event(event,{bubbles:true}));};
await check('Campos L/A do PhotoCraft escalam o conteúdo, com desfazer e refazer',async()=>{const row=[...d.querySelectorAll('.layer')].find(r=>r.querySelector('.layer-name')?.textContent==='Pontos de vida');row.querySelector('.layer-select-toggle').click();click('[data-pro=reset-visual-size]');const id=row.dataset.id,before=Number($('[data-photo-field="w"]').value);input('[data-photo-field="w"]',before/2,'change');const content=$('#sheet [data-block="'+id+'"] .visual-content');assert(content.getAttribute('transform').includes('0.5'),'Campo alterou só a caixa');click('#undoBtn');assert(Number($('[data-photo-field="w"]').value)===before,'Desfazer falhou');click('#redoBtn');assert(Number($('[data-photo-field="w"]').value)===Math.round(before/2),'Refazer falhou');click('#undoBtn');});
await check('Escala por porcentagem reduz também faixas e marcadores',async()=>{const id=$('.layer.active').dataset.id;input('#visualScalePercent','50');click('[data-pro="apply-visual-scale"]');assert($('#sheet [data-block="'+id+'"] .visual-content').getAttribute('transform')==='scale(0.5,0.5)','Percentual não escalou tudo');click('#undoBtn');});
await check('Tamanho dos marcadores pode mudar sem alterar as letras',async()=>{const id=$('.layer.active').dataset.id,root=$('#sheet [data-block="'+id+'"]'),before=[...root.querySelectorAll('text')].map(t=>t.getAttribute('font-size')).join(',');input('[data-prop="visualStyle.markerScale"]','50');const next=$('#sheet [data-block="'+id+'"]');assert([...next.querySelectorAll('text')].map(t=>t.getAttribute('font-size')).join(',')===before,'Letras foram alteradas');click('#undoBtn');});
await check('Alças de redimensionamento escalam os elementos internos',async()=>{const handle=$('.handle-e'),r=handle.getBoundingClientRect(),id=$('.layer.active').dataset.id;handle.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,clientX:r.x+3,clientY:r.y+3}));w.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:r.x+50,clientY:r.y+3}));w.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true}));assert($('#sheet [data-block="'+id+'"] .visual-content').getAttribute('transform')!=='scale(1,1)','Alça não escalou o desenho');click('#undoBtn');});
await check('Salvar e recarregar conserva a escala visual',async()=>{input('#visualScalePercent','75');click('[data-pro="apply-visual-scale"]');const id=$('.layer.active').dataset.id;click('[data-pro="save-now"]');await wait(()=>$('#saveStatus').textContent.startsWith('Salvo neste navegador às'),'Não salvou');frame.contentWindow.location.reload();await wait(()=>frame.contentDocument!==d&&frame.contentDocument.querySelector('#sheet [data-block="'+id+'"] .visual-content'),'Não reabriu');d=frame.contentDocument;w=frame.contentWindow;assert($('#sheet [data-block="'+id+'"] .visual-content').getAttribute('transform')==='scale(0.75,0.75)','Escala perdida');});
document.title='PASS · Rituais e redimensionamento';
}catch{document.title='FAIL · Rituais e redimensionamento';}};
</script>

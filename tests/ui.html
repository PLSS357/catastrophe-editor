<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes de interface · Catastrophe</title><style>body{font:14px Arial;background:#141b10;color:#e4edda;margin:18px}button{background:#d1f49b;padding:12px;border:0;border-radius:5px}iframe{width:100%;height:760px;border:1px solid #73835c;margin-top:16px}li{padding:4px}.pass{color:#b2ed8b}.fail{color:#ff9e92}</style><h1>Fluxos de interface</h1><p>Execute em uma origem local exclusiva de testes. Cria uma ficha de teste e não exclui fichas existentes.</p><button id="run">Executar testes de interface</button><ol id="results"></ol><iframe id="app" src="../dist/" title="Editor em teste"></iframe><script type="module">
const frame=document.querySelector('#app'),results=document.querySelector('#results');
const wait=async(fn,message)=>{const deadline=Date.now()+8000;while(Date.now()<deadline){if(fn())return;await new Promise(r=>setTimeout(r,40));}throw Error(message);};
const assert=(value,message)=>{if(!value)throw Error(message);};
document.querySelector('#run').onclick=async()=>{results.innerHTML='';document.querySelector('#run').disabled=true;let d,w;const $=s=>d.querySelector(s),click=s=>{const el=$(s);assert(el,'Controle ausente: '+s);el.click();},fill=(selector,value)=>{const el=$(selector);assert(el,'Campo ausente: '+selector);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));},check=async(name,fn)=>{const item=document.createElement('li');try{await fn();item.textContent='✓ '+name;item.className='pass';}catch(error){item.textContent='✗ '+name+': '+error.message;item.className='fail';throw error;}finally{results.append(item);}};
try{await wait(()=>frame.contentDocument?.querySelector('#sheet .sheet-block'),'Editor indisponível');d=frame.contentDocument;w=frame.contentWindow;
await check('Criar ficha sem substituir a anterior',async()=>{click('#startNewBtn');click('#wizardBlank');click('#wizardReview');await wait(()=>$('#wizardFinish'),'Revisão não abriu');click('#wizardFinish');await wait(()=>!$('#modal').open&&$('[data-doc="name"]')?.value==='Novo agente','Ficha não criada');click('[data-view="character"]');fill('[data-doc="name"]','Teste de interface');await wait(()=>$('#documentName').textContent==='Teste de interface','Nome não atualizado');});
await check('Inserir texto e editar diretamente na página',async()=>{click('[data-pro="insert-text"]');const selected=$('#sheet [data-block="'+$('.layer.active').dataset.id+'"]');selected.querySelector('text').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await wait(()=>$('.inline-editor'),'Edição direta ausente');$('.inline-editor').value='Título com ação';$('.inline-editor').dispatchEvent(new w.FocusEvent('blur'));assert($('#sheet').textContent.includes('TÍTULO COM AÇÃO'),'Título não atualizado');});
await check('Rotação e desfazer/refazer restauram a seleção',async()=>{fill('[data-prop="rotation"]','30');assert($('#sheet').innerHTML.includes('rotate(30,'),'Rotação ausente');click('#undoBtn');assert($('[data-prop="rotation"]').value==='0','Undo falhou');click('#redoBtn');assert($('[data-prop="rotation"]').value==='30','Redo falhou');assert(d.querySelectorAll('.transform-handle').length===9,'Oito alças + rotação não disponíveis');});
await check('Um redimensionamento completo gera uma operação lógica',async()=>{fill('[data-prop="rotation"]','0');const before=Number($('[data-block-prop="w"]').value),handle=$('.handle-e'),rect=handle.getBoundingClientRect();handle.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,clientX:rect.x+4,clientY:rect.y+4}));w.dispatchEvent(new w.PointerEvent('pointermove',{bubbles:true,clientX:rect.x+34,clientY:rect.y+4}));w.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true}));assert(Number($('[data-block-prop="w"]').value)>before,'Alça não redimensionou');click('#undoBtn');assert(Number($('[data-block-prop="w"]').value)===before,'Arraste não foi desfeito em uma operação');fill('[data-prop="rotation"]','30');});
await check('Agrupamento e desagrupamento preservam as partes',async()=>{click('[data-pro="insert-text"]');const rows=[...d.querySelectorAll('.layer')],other=rows.find(row=>!row.classList.contains('active'));other.querySelector('.layer-select-toggle').dispatchEvent(new w.MouseEvent('click',{bubbles:true,shiftKey:true}));click('#groupBtn');assert(d.querySelectorAll('.layer-group-row').length>0,'Grupo não criado');click('#ungroupBtn');assert(d.querySelectorAll('.layer.active').length>=2,'Partes não preservadas');});
await check('Componentes salvos podem ser reinseridos',async()=>{click('[data-pro="save-component"]');const name='Componente de interface '+Date.now();$('#libraryName').value=name;click('#confirmSaveLibrary');await wait(()=>!$('#modal').open,'Componente não salvo');click('[data-pro="library"]');await wait(()=>[...d.querySelectorAll('.library-card')].some(c=>c.querySelector('strong').textContent===name),'Biblioteca vazia');const before=d.querySelectorAll('#sheet .sheet-block').length;[...d.querySelectorAll('.library-card')].find(c=>c.querySelector('strong').textContent===name).querySelector('[data-insert]').click();assert(d.querySelectorAll('#sheet .sheet-block').length>before,'Componente não inserido');});
await check('Guias não aparecem na prévia e prévia não altera recursos',async()=>{click('[data-pro="guides"]');click('#addGuide');await wait(()=>$('#guidesList').textContent.includes('960'),'Guia não criada');click('#modal [data-action="close-modal"]');click('#playMode');assert($('#selectionOverlay').innerHTML==='','Seleção visível na prévia');assert(d.querySelectorAll('#sheet [data-point]').length===0,'Controles de jogo expostos');click('#editMode');});
await check('Versão nomeada é persistida',async()=>{click('[data-pro="versions"]');await wait(()=>$('#versionTitle'),'Painel de versões não abriu');$('#versionTitle').value='Versão de interface';click('#saveVersion');await wait(()=>$('#modal').textContent.includes('Versão de interface'),'Versão não salva');click('#modal [data-action="close-modal"]');});
await check('Reabrir mantém o documento válido e suas transformações',async()=>{click('[data-pro="save-now"]');await wait(()=>$('#saveStatus').textContent.startsWith('Salvo neste navegador às'),'Salvamento não terminou');frame.contentWindow.location.reload();await wait(()=>frame.contentDocument!==d&&frame.contentDocument.querySelector('#documentName')?.textContent==='Teste de interface'&&frame.contentDocument.querySelector('#sheet .sheet-block'),'Ficha não reabriu');d=frame.contentDocument;w=frame.contentWindow;assert($('#sheet').innerHTML.includes('rotate(30,'),'Transformação perdida');});
await check('Exportação disponibiliza PNG, SVG, PDF e JSON',async()=>{click('#exportBtn');for(const format of ['png','svg','pdf','json'])assert($('[data-final-export="'+format+'"]'),'Formato ausente: '+format);click('#modal [data-action="close-modal"]');});
await check('Biblioteca completa permite buscar e escolher formas documentadas',async()=>{click('[data-view="character"]');click('[data-action="add-ritual"]');await wait(()=>$('#ritualSearch'),'Biblioteca não carregou');assert($('#ritualResultCount').textContent==='109 de 109 entradas','Catálogo incompleto');fill('#ritualSearch','vampirismo');assert($('#ritualResultCount').textContent==='1 de 109 entradas','Busca incorreta');$('#ritualFormChoice').value='Verdadeiro';$('#ritualFormChoice').dispatchEvent(new w.Event('change',{bubbles:true}));assert($('#ritualFormDetails').textContent.includes('13 PE'),'Custo de referência incorreto');click('#addCatalogRitual');await wait(()=>$('[data-ritual-field="title"]'),'Ritual não inserido');assert($('[data-ritual-field="title"]').value==='Vampirismo — Verdadeiro','Forma errada inserida');assert($('[data-ritual-field="meta"]').value.includes('13 PE'),'Referência foi convertida silenciosamente');click('[data-action="finish-ritual"]');});
await check('Conversões existentes continuam disponíveis e o histórico desfaz a inclusão',async()=>{click('[data-action="add-ritual"]');await wait(()=>$('#ritualSearch'),'Biblioteca não abriu');fill('#ritualSearch','cicatrizacao');assert($('#ritualModeChoice').value==='reviewed','Conversão existente não selecionada');click('#addCatalogRitual');await wait(()=>$('[data-ritual-field="meta"]'),'Ritual não inserido');assert($('[data-ritual-field="meta"]').value.includes('4 PD'),'Custo existente foi alterado');click('[data-action="finish-ritual"]');click('#undoBtn');assert(!$('#leftContent').textContent.includes('CICATRIZAÇÃO'),'Inclusão não foi desfeita');});
await check('Preferências PDF são restauradas sem precisar exportar',async()=>{click('#exportBtn');$('#pdfOrientation').value='portrait';$('#pdfOrientation').dispatchEvent(new w.Event('input',{bubbles:true}));fill('#pdfMargin','16');$('#pdfPage').value='A3';$('#pdfPage').dispatchEvent(new w.Event('input',{bubbles:true}));click('#modal [data-action="close-modal"]');click('#exportBtn');assert($('#pdfOrientation').value==='portrait'&&$('#pdfMargin').value==='16'&&$('#pdfPage').value==='A3','Preferências perdidas');assert($('#pdfMode').value==='vector','Modo vetorial não disponível');click('#modal [data-action="close-modal"]');});
await check('Composição oferece expansão e a altura da página é reversível',async()=>{click('[data-pro="templates"]');await wait(()=>$('[data-composition="uma"]'),'Modelos não abriram');click('[data-composition="uma"]');await wait(()=>$('#applyCompositionPlan'),'Prévia de composição ausente');assert($('#modal').textContent.includes('fonte não será reduzida'),'Plano não informa preservação de fonte');click('#applyCompositionPlan');const size=$('#sheet').getAttribute('viewBox').split(' ').map(Number);assert(size[3]>1431,'Página não expandiu');click('#undoBtn');assert($('#sheet').getAttribute('viewBox').split(' ')[3]==='1431','Undo não restaurou dimensão');assert(Math.abs($('#stageWrap').getBoundingClientRect().height/$('#stageWrap').getBoundingClientRect().width-1431/1920)<.01,'Área de edição não restaurou proporção');});
await check('Clique simples substitui camadas e Shift adiciona',async()=>{const rows=[...d.querySelectorAll('.layer')];rows[0].querySelector('.layer-select-toggle').click();const id=rows[1].dataset.id;click('.layer[data-id="'+id+'"] .layer-select-toggle');assert(d.querySelectorAll('.layer.active').length===1,'Clique acumulou seleção');const other=[...d.querySelectorAll('.layer')].find(r=>r.dataset.id!==id);other.querySelector('.layer-select-toggle').dispatchEvent(new w.MouseEvent('click',{bubbles:true,shiftKey:true}));assert(d.querySelectorAll('.layer.active').length===2,'Shift não adicionou');});
await check('Propriedades têm quatro seções e uma opacidade',async()=>{const row=$('.layer');row.querySelector('.layer-select-toggle').click();for(const title of ['Conteúdo','Posição','Aparência','Avançado'])assert($('[data-section="'+title+'"]'),'Seção ausente: '+title);assert(d.querySelectorAll('#inspectorContent [data-prop="opacity"],#inspectorContent [data-block-prop="opacity"]').length===1,'Opacidade duplicada');});
await check('Modo de foco recolhe painéis e pode ser revertido',async()=>{click('#focusMode');assert(d.body.classList.contains('focus-mode'),'Foco não ativado');click('[data-studio="fit-width"]');assert(Number($('#zoomValue').textContent.replace('%',''))>40,'Largura não ampliou leitura');click('#focusMode');assert(!d.body.classList.contains('focus-mode'),'Foco não encerrou');});
await check('Segunda página mantém conteúdo e os dados compartilhados',async()=>{click('[data-studio="pages"]');$('#newPageName').value='História de interface';click('#addSheetPage');click('[data-pro="insert-text"]');fill('[data-block-prop="body"]','Texto persistido na segunda página.');const first=$('#activeSheetPage').options[0].value,second=$('#activeSheetPage').value;$('#activeSheetPage').value=first;$('#activeSheetPage').dispatchEvent(new w.Event('change',{bubbles:true}));assert(!$('#sheet').textContent.includes('Texto persistido na segunda página'),'Blocos misturados');$('#activeSheetPage').value=second;$('#activeSheetPage').dispatchEvent(new w.Event('change',{bubbles:true}));assert($('#sheet').textContent.includes('Texto persistido'),'Conteúdo perdido');assert($('#documentName').textContent==='Teste de interface','Dados do personagem mudaram');});
await check('Dados vinculados repetem o valor na nova página',async()=>{click('[data-studio="linked"]');$('#linkedKind').value='name';click('#insertLinked');assert($('#sheet').textContent.includes('TESTE DE INTERFACE'),'Nome vinculado ausente');});
await check('Menu de contexto oferece ações de texto e seleção múltipla',async()=>{const el=$('#sheet .sheet-block');el.dispatchEvent(new w.MouseEvent('contextmenu',{bubbles:true,clientX:500,clientY:300}));assert($('.context-menu').textContent.includes('Editar conteúdo'),'Menu de texto ausente');assert($('.context-menu').textContent.includes('Copiar estilo'),'Estilo ausente');$('.context-menu').remove();});
await check('Biblioteca de conteúdo insere cópia personalizável',async()=>{click('[data-studio="content"]');await wait(()=>$('#saveContent'),'Biblioteca indisponível');$('#contentName').value='Habilidade UI '+Date.now();$('#contentBody').value='Efeito reutilizável de teste.';click('#saveContent');await wait(()=>$('[data-content-insert]'),'Conteúdo não salvo');click('[data-content-insert]');assert($('#sheet').textContent.includes('Efeito reutilizável'),'Conteúdo não inserido');});
await check('Impressão econômica tem fundo claro e preserva ficha',async()=>{click('#economicMode');assert(d.body.classList.contains('economic-preview'),'Prévia não abriu');assert($('#sheet').innerHTML.includes('#ffffff'),'Fundo não clareou');click('#economicMode');assert(!d.body.classList.contains('economic-preview'),'Prévia não fechou');});
await check('Exportação e lote exibem configurações prontas',async()=>{click('#exportBtn');for(const preset of ['image','print','portable'])assert($('[data-export-preset="'+preset+'"]'),'Predefinição ausente');click('#modal [data-action="close-modal"]');click('[data-studio="batch"]');assert($('#batchFormat')&&$('[data-batch-id]'),'Seleção do grupo ausente');click('#modal [data-action="close-modal"]');});
await check('Reabertura preserva páginas e miniaturas de versões',async()=>{click('[data-pro="save-now"]');await wait(()=>$('#saveStatus').textContent.startsWith('Salvo neste navegador às'),'Salvamento não terminou');frame.contentWindow.location.reload();await wait(()=>frame.contentDocument!==d&&frame.contentDocument.querySelector('#activeSheetPage')?.options.length===2,'Páginas não reabriram');d=frame.contentDocument;w=frame.contentWindow;click('[data-pro="versions"]');await wait(()=>$('.version-with-preview svg'),'Miniatura de versão ausente');click('#modal [data-action="close-modal"]');});
await check('Texto longo pode continuar em páginas sem cortar silenciosamente',async()=>{click('[data-pro="insert-text"]');fill('[data-block-prop="body"]','História completa com memória e equipe. '.repeat(90));click('[data-studio="continue"]');assert($('#confirmContinue'),'Confirmação da continuação ausente');click('#confirmContinue');assert($('#activeSheetPage').options.length>2,'Continuação não criou páginas');assert($('#pageControls').textContent.includes('Página'),'Seletor perdido');});
await check('Prévia do tema explica estilos individuais e mostra composição',async()=>{click('[data-pro="styles"]');await wait(()=>$('#themePreview svg'),'Tema sem prévia');assert($('#modal').textContent.includes('individuais'),'Herança não explicada');click('#modal [data-action="close-modal"]');});
}catch{}finally{document.querySelector('#run').disabled=false;document.title=d?.querySelector('#saveStatus')&&results.querySelectorAll('.fail').length===0?'PASS · Testes de interface':'FAIL · Testes de interface';}}
</script></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141713"><meta name="description" content="Crie fichas de Catastrophe no estilo de Ordem Paranormal II. Edite atributos, poderes e rituais, organize os blocos e exporte sua ficha."><title>Catastrophe — Ateliê de fichas</title><link rel="icon" href="./assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./multiselect.css"><link rel="stylesheet" href="./grouping.css"><link rel="stylesheet" href="./professional.css"><link rel="stylesheet" href="./studio.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Catastrophe, editor de fichas"><img src="./assets/mark.svg" width="31" height="31" alt=""><span>CATASTROPHE<small>ATELIÊ DE FICHAS</small></span></a><div class="document-title"><span class="status-dot"></span><span id="documentName">Lian Rosseul</span><span class="version">PRIMEIRA MISSÃO</span></div><div class="top-actions"><button id="startNewBtn" class="start-new" aria-label="Começar ficha nova"><span data-icon="plus"></span><span class="start-new-label">Começar ficha nova</span></button><span id="saveStatus" class="save-status" aria-live="polite">Carregando…</span><button id="importBtn" class="quiet" title="Importar ficha JSON"><span data-icon="upload"></span><span class="button-label">Importar</span></button><button id="exportBtn" class="primary"><span data-icon="download"></span>Exportar<span data-icon="chevron-down"></span></button></div></header>
<div class="workspace"><nav class="rail" aria-label="Ferramentas"><button data-view="character" class="rail-btn active" title="Personagem"><span data-icon="user"></span></button><button data-view="library" class="rail-btn" title="Minhas fichas"><span data-icon="folder"></span></button><button data-view="layout" class="rail-btn" title="Blocos e layout"><span data-icon="layout"></span></button><div class="rail-bottom"><button id="helpBtn" class="rail-btn" title="Como usar"><span data-icon="help"></span></button></div></nav>
<aside id="leftPanel" class="left-panel"><div class="panel-heading"><div><p class="eyebrow">EDITOR</p><h1 id="panelTitle">Personagem</h1></div><button id="newBtn" class="icon-btn" title="Nova ficha"><span data-icon="plus"></span></button></div><div id="leftContent" class="panel-scroll"></div></aside>
<main class="studio"><div class="studio-toolbar"><div class="segmented"><button id="editMode" class="active"><span data-icon="cursor"></span>Editar</button><button id="playMode"><span data-icon="eye"></span>Visualizar</button></div><span class="toolbar-divider"></span><button id="undoBtn" class="icon-btn" title="Desfazer (Ctrl+Z)"><span data-icon="undo"></span></button><button id="redoBtn" class="icon-btn" title="Refazer (Ctrl+Shift+Z)"><span data-icon="redo"></span></button><div class="toolbar-spacer"></div><label class="grid-control"><input id="snapToggle" type="checkbox" checked>Encaixar</label><button id="fitBtn" class="quiet fit-button">Ajustar</button><button id="mobileInspector" class="icon-btn" title="Propriedades"><span data-icon="sliders"></span></button></div>
<div class="group-toolbar"><button id="groupBtn" data-action="group-selection" disabled title="Agrupar (Ctrl+G)"><span data-icon="folder"></span>Agrupar</button><button id="ungroupBtn" data-action="ungroup-selection" disabled title="Desagrupar (Ctrl+Shift+G)"><span data-icon="layout"></span>Desagrupar</button><small id="groupStatus">Selecione os elementos da ficha</small></div>
<div id="stageViewport" class="stage-viewport"><div class="canvas-caption"><span>FICHA DO AGENTE</span><span id="canvasSize">1920 × 1431</span></div><div id="stageWrap" class="stage-wrap"><svg id="sheet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ficha editável do personagem" viewBox="0 0 1920 1431"></svg><div id="rulerX" class="ruler x"></div><div id="rulerY" class="ruler y"></div><div id="guideOverlay"></div><div id="selectionOverlay"></div></div><div class="canvas-hint"><span data-icon="move"></span><span id="canvasHint">Selecione um bloco para editar. Arraste para reorganizar.</span></div></div>
<footer class="studio-footer"><span><span class="little-dot"></span><span id="selectionName">Modelo Ordem II</span> <small id="transformStatus"></small></span><span class="zoom-controls"><button id="zoomOut" class="icon-btn" title="Diminuir zoom">−</button><button id="zoomValue" class="quiet">Ajustar</button><button id="zoomIn" class="icon-btn" title="Aumentar zoom">+</button></span></footer></main>
<aside id="inspector" class="inspector"><div class="inspector-heading"><span data-icon="sliders"></span><h2>Propriedades</h2><button id="closeInspector" class="icon-btn" title="Fechar propriedades">×</button></div><div id="inspectorContent" class="panel-scroll"></div></aside></div>
<div id="toast" class="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><div id="exportMenu" class="export-menu" hidden><button data-export="png"><span data-icon="image"></span><span>Imagem PNG<small>Alta resolução · 3840 × 2862</small></span></button><button data-export="json"><span data-icon="file"></span><span>Arquivo da ficha<small>Dados, imagem e organização</small></span></button><button data-export="svg"><span data-icon="code"></span><span>Imagem vetorial SVG<small>Para impressão e edição</small></span></button><button data-export="pdf"><span data-icon="file"></span><span>PDF direto<small>Alta resolução · opções em Exportar…</small></span></button><button data-export="print"><span data-icon="printer"></span><span>Imprimir / salvar PDF</span></button></div><input type="file" id="importFile" accept="application/json,.json" hidden><input type="file" id="portraitFile" accept="image/png,image/jpeg,image/webp" hidden><script type="module" src="./app.js"></script></body></html>
